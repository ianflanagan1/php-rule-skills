version: '3'

tasks:
  check:
    desc: Run every check, failing on any problem
    cmds:
      - task: lint
      - task: test

  lint:
    desc: ShellCheck every shell script
    cmds:
      - shellcheck --external-sources skills/*/scripts/*.sh tests/*.sh

  lint-file:
    desc: ShellCheck the shell scripts given after --
    cmds:
      - |
        files=$(for f in {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}; do case $f in *.sh) echo "$f" ;; esac; done)
        [ -z "$files" ] || shellcheck --external-sources $files

  test:
    desc: Run the shunit2 tests, or just the test files given after --
    vars:
      FILES: '{{if .CLI_ARGS_LIST}}{{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}{{else}}tests/*_test.sh{{end}}'
    cmds:
      # Every file runs, so one failure doesn't hide the rest.
      - |
        failed=0
        for t in {{.FILES}}; do
          echo "== $(basename "$t")"
          bash "$t" || failed=1
        done
        exit "$failed"
